name: church_youth_app
description: 교회 청년부 관리 앱 - 출석, 회비, 심방신청

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # State management
  provider: ^6.1.2

  # UI
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.1

  # File handling
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  excel: ^4.0.6

  # Auth
  google_sign_in: ^6.2.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

# flutter_native_splash 패키지는 제거했지만(excel과의 archive 버전 충돌,
# 아래 참고), 스플래시 재생성이 필요할 때 쓸 설정값이라 남겨둔다 — 이미
# 생성된 android/ios 스플래시 리소스는 그대로 유지됨
flutter_native_splash:
  color: "#F5F5F5"
  image: assets/icon/splash.png
  android_12:
    color: "#F5F5F5"
    image: assets/icon/splash.png
