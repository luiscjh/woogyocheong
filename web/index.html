<!DOCTYPE html><html lang="ko"><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="우리 교회 청년부 앱 - 출석, 회비, 심방 신청과 공지를 한곳에서">
  <meta name="theme-color" content="#3F51B5">
  <meta name="application-name" content="우교청">

  <!-- 설치형 웹앱(크롬 "앱 설치", iOS "홈 화면에 추가") — 서비스 워커 없이 manifest만 사용 -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="우교청">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <title>우교청</title>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F5F5F5;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 웹에서는 푸시(FCM)를 쓰지 않는다(웹 푸시는 서비스 워커가 필요한데 우교청 웹은
    // 서비스 워커 없이 운영). firebase_messaging 플러그인이 앱 빌드에 포함돼도
    // Firebase Messaging JS를 내려받지 않도록 제외 — 앱 코드도 웹에서는 호출하지 않음
    window.flutterfire_ignore_scripts = ['messaging'];
  </script>
  <script src="flutter_bootstrap.js" async=""></script>
  <script>
    // 우교청은 서비스 워커 없이 일반 웹사이트로 동작한다. 새로 배포하면
    // 다음 접속에서 바로 반영되도록(firebase.json의 Cache-Control: no-cache와
    // 함께), 예전에 등록된 서비스 워커(PWA용 sw.js, Flutter 기본
    // flutter_service_worker.js)가 남아 있으면 모두 해제하고, 그 워커들이
    // 만든 캐시도 지운다(해제가 먼저 되면 sw.js 정리용 코드가 실행될 기회가
    // 없으므로 여기서 직접 지운다).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      }).catch(function () {});
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          if (key.indexOf('woogyocheong-') === 0 || key.indexOf('flutter-') === 0) {
            caches.delete(key);
          }
        });
      }).catch(function () {});
    }
  </script>
  <script>
    // 새 배포 감지. 설치형으로 실행하면 앱을 닫지 않고 백그라운드에 두었다가 다시
    // 여는 일이 많아, 페이지가 새로 로드되지 않고 옛 버전이 계속 떠 있을 수 있다.
    // 화면으로 돌아올 때와 보고 있는 동안 5분마다 main.dart.js의 ETag만(HEAD, 본문
    // 없음) 확인해, 처음 받은 값과 달라지면 앱(lib/utils/web_update/web_update_web.dart)에
    // 알려 "새로고침" 안내를 띄운다. 새로고침 자체는 사용자가 누를 때만 한다
    // (입력 중인 내용이 사라지지 않도록).
    (function () {
      var baseline = null;
      var found = false;
      function notify() {
        window.woogyocheongUpdateReady = true;
        if (typeof window.woogyocheongOnUpdate === 'function') window.woogyocheongOnUpdate();
      }
      function check() {
        // 이미 찾았으면 다시 확인하지 않고 안내만 다시 띄운다(다른 알림에 밀려 닫혔을 수 있음)
        if (found) { notify(); return; }
        fetch('main.dart.js', { method: 'HEAD', cache: 'no-store' }).then(function (res) {
          if (!res.ok) return;
          var tag = res.headers.get('etag') || res.headers.get('last-modified');
          if (!tag) return;
          if (baseline === null) { baseline = tag; return; }
          if (tag !== baseline) {
            found = true;
            notify();
          }
        }).catch(function () {});
      }
      window.woogyocheongReload = function () { location.reload(); };
      check();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
      setInterval(function () {
        if (document.visibilityState === 'visible') check();
      }, 5 * 60 * 1000);
    })();
  </script>


</body></html>
