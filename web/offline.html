<!DOCTYPE html>
<html lang="ko">

  <meta charset="UTF-8">

  <title>우교청 - 오프라인</title>
  <style>
    :root { --fg: #212121; --muted: #757575; --bg: #F5F5F5; --card: #fff; --primary: #3F51B5; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #aaa; --bg: #121212; --card: #1e1e1e; } }
    html, body { height: 100%; }
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg);
           font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { box-sizing: border-box; width: 100%; max-width: 360px; margin: 16px; padding: 32px 24px;
           background: var(--card); border-radius: 12px; text-align: center;
           box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { border: 0; border-radius: 8px; padding: 12px 24px; font-size: 15px;
             background: var(--primary); color: #fff; cursor: pointer; }
  </style>
</head>
